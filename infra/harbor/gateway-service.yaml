# In-cluster path to Harbor that matches the external URL (harbor.local:9443).
# Fixed ClusterIP so CoreDNS can map harbor.local to it. Targets Envoy's TLS listener (8443).
apiVersion: v1
kind: Service
metadata: {name: harbor-gw, namespace: projectcontour}
spec:
  clusterIP: 10.96.0.200
  selector: {app: envoy}
  ports: [{name: https, port: 9443, targetPort: 8443}]
