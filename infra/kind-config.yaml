# kind cluster for the artifact-SDLC POC (kind v0.25.0 -> Kubernetes v1.31.2).
# Create:  kind create cluster --config infra/kind-config.yaml
# Host ports 80, 8080, 8443 are taken on this box, so ingress is on 8088/9443 (loopback only).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sdlc-poc
nodes:
  - role: control-plane
    image: kindest/node:v1.31.2@sha256:18fbefc20a7113353c7b75b5c869d7145a6abd6269154825872dc59c1329912e
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8088
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 9443
        listenAddress: "127.0.0.1"
        protocol: TCP
